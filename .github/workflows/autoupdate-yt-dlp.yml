name: autoupdate-yt-dlp

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: autoupdate-yt-dlp
  cancel-in-progress: false

jobs:
  autoupdate-yt-dlp:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check for a newer yt-dlp release
        id: version
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import urllib.request

          requirements = pathlib.Path("requirements.txt")
          contents = requirements.read_bytes()
          match = re.search(rb"(?m)^yt_dlp\[default\]==([^\s]+)(?=\r?$)", contents)
          if match is None:
              raise SystemExit("Could not find the pinned yt_dlp[default] requirement")

          with urllib.request.urlopen("https://pypi.org/pypi/yt-dlp/json", timeout=30) as response:
              latest = json.load(response)["info"]["version"]

          current = match.group(1).decode()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"current={current}", file=output)
              print(f"latest={latest}", file=output)
              print(f"update_required={str(current != latest).lower()}", file=output)

          print(f"Current yt-dlp: {current}")
          print(f"Latest yt-dlp:  {latest}")

      - name: Update requirements.txt
        if: steps.version.outputs.update_required == 'true'
        env:
          LATEST_VERSION: ${{ steps.version.outputs.latest }}
        shell: python
        run: |
          import os
          import pathlib
          import re

          requirements = pathlib.Path("requirements.txt")
          contents = requirements.read_bytes()
          updated, replacements = re.subn(
              rb"(?m)^yt_dlp\[default\]==[^\s]+(?=\r?$)",
              f"yt_dlp[default]=={os.environ['LATEST_VERSION']}".encode(),
              contents,
          )
          if replacements != 1:
              raise SystemExit(f"Expected to update one yt-dlp pin, updated {replacements}")
          requirements.write_bytes(updated)

      - name: Commit and push the updated pin
        if: steps.version.outputs.update_required == 'true'
        env:
          LATEST_VERSION: ${{ steps.version.outputs.latest }}
        run: |
          git config user.email "yt-dlp@autoupdate"
          git config user.name "yt-dlp-autoupdate"
          git add requirements.txt
          git commit -m "Update yt-dlp version to ${LATEST_VERSION}"
          git push

      - name: Trigger image build
        if: steps.version.outputs.update_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml --ref main
