<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/x-icon" href="{{url_for('static', filename='logo.png')}}">

  <!-- Warm up the CDN connections used below -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <!-- Apply the saved/preferred theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
    })();
  </script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">

  <!-- App scripts: deferred so they never block first paint, executed in order -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.js"
    integrity="sha512-tE1z+95+lMCGwy+9PnKgUSIeHhvioC9lMlI7rLWU0Ps3XTdjRygLcy4mLuL0JAoK4TLdQEyP0yOl/9dMOqpH/Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.min.js"
    integrity="sha512-ykZ1QQr0Jy/4ZkvKuqWn4iF3lqPZyij9iRv6sGqLRdTPkY69YX6+7wvVGmsdBbiIfN/8OdsI7HABjvEok6ZopQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="{{url_for('static', filename='script.js')}}"></script>

  <title>LidaTube</title>
</head>

<body>
  <!-- Top Bar -->
  <div class="sticky-top">
    <div class="container-fluid bg-dark">
      <div class="top-bar d-flex justify-content-between align-items-center">
        <h1 class="title text-center text-light flex-grow-1 my-1 ps-2 ms-5" id="return-to-top">LidaTube</h1>
        <button class="btn btn-link text-light icon-btn" id="settings-button" data-bs-toggle="modal"
          aria-label="Open settings" data-bs-target="#config-modal">
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Cards -->
  <div class="container-fluid mt-2 card-container">
    <div class="row cards-row">
      <div class="col-md-6 col-12 mb-3">
        <div class="card h-100" id="lidarr-card">
          <div class="card-body d-flex flex-column">
            <div class="row">
              <div class="col-auto">
                <img src="{{url_for('static', filename='lidarr.svg')}}" alt="Logo" class="logo">
              </div>
              <div class="col-auto d-flex align-items-center justify-content-start p-0">
                <h2 class="panel-title mb-0">Lidarr</h2>
              </div>
            </div>
            <div class="btn-group mt-1">
              <button class="btn btn-primary w-100" id="get-lidarr-wanted-btn">
                <span class="spinner-border spinner-border-sm d-none" id="lidarr-spinner" role="status"
                  aria-hidden="true"></span>
                Refresh
              </button>
              <button class="btn btn-warning w-100" id="stop-lidarr-btn" aria-label="Stop Lidarr refresh">Stop</button>
              <button class="btn btn-danger w-100" id="reset-lidarr-btn" aria-label="Reset Lidarr data">Reset</button>
            </div>
            <div class="container non-scrollable my-1 p-0" id="select-all">
              <div id="lidarr-progress-status-bar" class="progress">
                <div id="lidarr-progress-status-bar-inner" class="progress-bar progress-bar-striped bg-primary" role="progressbar" aria-valuenow="0" aria-valuemin="0"
                  aria-valuemax="100" style="width: 0%">0%</div>
              </div>
              <div id="lidarr-scan-status-text" class="small text-muted mt-1">Loading...</div>
              <div id="lidarr-count-text" class="small text-muted"></div>
            </div>
            <div class="container scrollable p-0">
              <div class="table">
                <table class="table table-striped" id="lidarr-table">
                  <thead class="thead-sticky">
                    <tr>
                      <th>
                        <div class="form-check">
                          <input class="form-check-input" type="checkbox" id="select-all-checkbox">
                        </div>
                      </th>
                      <th>Album Name</th>
                      <th class="text-center">Wanted</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Data will be populated dynamically using JavaScript -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-12 mb-3">
        <div class="card h-100" id="ytdlp-card">
          <div class="card-body d-flex flex-column">
            <div class="row">
              <div class="col-auto">
                <img src="{{url_for('static', filename='yt_dlp.png')}}" alt="Logo" class="logo">
              </div>
              <div class="col-auto d-flex align-items-center justify-content-start p-0">
                <h2 class="panel-title mb-0">yt_dlp</h2>
              </div>
            </div>
            <div class="btn-group mt-1">
              <button class="btn btn-primary w-100 " id="start-ytdlp-btn">
                <span class="spinner-border spinner-border-sm d-none" id="ytdlp-spinner" role="status"
                  aria-hidden="true"></span>
                Download</button>
              <button class="btn btn-warning w-100 " id="stop-ytdlp-btn" aria-label="Stop downloads">Stop</button>
              <button class="btn btn-danger w-100 " id="reset-ytdlp-btn" aria-label="Reset download queue">Reset</button>
            </div>
            <div class="container non-scrollable my-1 p-0" id="progress-bar">
              <div id="ytdlp-progress-status-bar" class="progress">
                <div id="ytdlp-progress-status-bar-inner" class="progress-bar progress-bar-striped bg-primary" role="progressbar" aria-valuenow="0" aria-valuemin="0"
                  aria-valuemax="100" style="width: 0%">0%</div>
              </div>
              <div id="ytdlp-status-text" class="small text-muted mt-1">Loading</div>
            </div>
            <div class="container scrollable p-0">
              <div class="table">
                <table class="table table-striped" id="ytdlp-table">
                  <thead class="thead-sticky">
                    <tr>
                      <th>Search Item</th>
                      <th class="text-center">Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Data will be populated dynamically using JavaScript -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="config-modal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Configuration</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

        </div>
        <div class="modal-body">
          <div id="save-message" style="display: none;" class="alert alert-success mt-3">
            Settings saved successfully.
          </div>
          <div class="form-group-modal">
            <label for="lidarr-address">Lidarr Address:</label>
            <input type="text" class="form-control" id="lidarr-address" placeholder="Enter Lidarr Address">
          </div>
          <div class="form-group-modal my-3">
            <label for="lidarr-api-key">Lidarr API Key:</label>
            <input type="text" class="form-control" id="lidarr-api-key" placeholder="Enter Lidarr API Key">
          </div>
          <div class="form-group-modal my-3">
            <label for="sleep-interval">Sleep Interval (Seconds):</label>
            <input type="number" class="form-control" id="sleep-interval" min="0" placeholder="Enter Sleep Interval">
          </div>
          <div class="form-group-modal my-3">
            <label for="sync-schedule">Sync Schedule:</label>
            <input type="text" class="form-control" id="sync-schedule"
              placeholder="Enter Hour in 24hr format (use , for multiple hours)">
          </div>
          <div class="form-group-modal">
            <label for="minimum-match-ratio">Minimum Match Ratio (%):</label>
            <input type="text" class="form-control" id="minimum-match-ratio" placeholder="Minimum Match Ratio(%)">
          </div>
          <div class="form-group-modal my-3">
            <label>Cookies File:</label>
            <div class="d-flex align-items-center gap-2 mb-2">
              <span id="cookies-status-badge" class="badge bg-secondary">Checking...</span>
            </div>
            <div class="input-group">
              <input type="file" class="form-control" id="cookies-file-input">
              <button class="btn btn-primary" type="button" id="upload-cookies-btn">Upload</button>
              <button class="btn btn-danger" type="button" id="delete-cookies-btn">Delete</button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" id="save-changes-btn" class="btn btn-primary">Save changes</button>
          <div class="theme-toggle d-flex align-items-center gap-2 ms-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
            <div class="form-check form-switch m-0">
              <input class="form-check-input rounded" type="checkbox" id="theme-switch" aria-label="Toggle dark mode">
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast-template" class="toast d-none" role="alert" aria-live="assertive" aria-atomic="true"
      data-bs-delay="5000">
      <div class="toast-header">
        <strong class="me-auto"></strong>
        <small class="text-muted"></small>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body"></div>
    </div>
  </div>
</body>

</html>
